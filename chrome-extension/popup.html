<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Scroll & Skip Videos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .container {
      text-align: center;
    }
    
    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      font-weight: 600;
    }
    
    .status {
      margin-bottom: 20px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 14px;
    }
    
    .status.active {
      background: rgba(76, 175, 80, 0.3);
    }
    
    .status.inactive {
      background: rgba(244, 67, 54, 0.3);
    }
    
    .button {
      width: 100%;
      padding: 12px 24px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .button.start {
      background: #4caf50;
      color: white;
    }
    
    .button.start:hover {
      background: #45a049;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    .button.stop {
      background: #f44336;
      color: white;
    }
    
    .button.stop:hover {
      background: #da190b;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    .button.options {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    .button.options:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    
    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Auto Scroll & Skip Videos</h1>
    <div id="status" class="status inactive">
      Status: Inactive
    </div>
    <button id="startBtn" class="button start">Start</button>
    <button id="stopBtn" class="button stop" disabled>Stop</button>
    <button id="optionsBtn" class="button options">Options</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
